version: 2
updates:
  # uv.lock is the resolved dependency set; pyproject.toml holds the direct
  # pins. Dependabot moves both, and the lock-sync workflow regenerates the
  # flat requirements-lock.txt the launcher installs. A resolver moves pydantic
  # and pydantic-core together, which is what the old pip setup could not do.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      # Weekly produced more bot pull requests than releases; two of the last
      # three were closed unmerged. A reviewed monthly bump is enough.
      interval: monthly
    groups:
      python-runtime:
        patterns: ["*"]
    ignore:
      # pydantic pins pydantic-core exactly, and Dependabot's uv updater has
      # moved the core on its own regardless (#20: 2.48.0 against a pydantic
      # that needs 2.46.5), producing a lock pip cannot install. The core
      # follows whenever pydantic itself is bumped and re-resolved.
      - dependency-name: "pydantic-core"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
