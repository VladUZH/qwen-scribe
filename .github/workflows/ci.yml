name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a branch be built on the macOS runner before a pull request exists,
  # which is the only way to compile the native helper without a Mac at hand.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python and repository checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # The lowest version requirements-lock.txt can resolve on: numpy
          # 2.5.1 requires >= 3.12. Keep in sync with scripts/setup_python.sh.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Check shell scripts
        run: bash -n run.sh scripts/*.sh macos/*.sh
      - name: Run tests
        env:
          QWEN_SCRIBE_DATA_DIR: ${{ runner.temp }}/qwen-scribe-test-data
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/qwen-scribe-pycache
        run: python -m unittest discover -s tests -v
      - name: Run interface tests
        run: node --test tests/js/transcript.test.mjs
      - name: Check publishable source
        run: python scripts/check_repo.py
      - name: Check the dependency lock agrees with uv.lock
        run: |
          python -m pip install --disable-pip-version-check "uv==0.8.17"
          python scripts/export_lock.py --check
      - name: Compile Python sources
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/qwen-scribe-pycache
        run: python -m compileall -q server.py qwen_scribe quantize_8bit.py compare_models.py tests

  macos-app:
    name: Build macOS arm64 apps
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Resolve the shipped dependency lock
        # The set users actually install. Nothing else in CI proves it can
        # still be resolved on the minimum supported interpreter.
        run: python -m pip install --dry-run --ignore-installed -r requirements-lock.txt
      - name: Build app bundles
        run: make app
      - name: Verify bundles
        run: |
          plutil -lint "dist/Qwen Scribe.app/Contents/Info.plist"
          plutil -lint "dist/Stop Qwen Scribe.app/Contents/Info.plist"
          file "dist/Qwen Scribe.app/Contents/MacOS/QwenScribe" | grep arm64
          test ! -e "dist/Qwen Scribe.app/Contents/MacOS/QwenScribeDictation"
          codesign --verify --deep --strict "dist/Qwen Scribe.app"
          codesign --verify --strict "dist/Stop Qwen Scribe.app"
