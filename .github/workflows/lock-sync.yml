name: Lock sync

# Dependabot updates uv.lock (and the pins in pyproject.toml). The flat
# requirements-lock.txt that the launcher installs is generated from it, so
# this regenerates the export on Dependabot's own branch and pushes the
# result there. Without it every bot pull request would fail the drift check
# in CI and need a hand-run `make lock`.
#
# pull_request_target is what gives the job a token that can push to the
# branch; it is restricted to Dependabot's branches, and the only thing run
# from the branch is `uv export` over its lock file.

on:
  pull_request_target:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  export:
    name: Regenerate requirements-lock.txt
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.8.17"
      - name: Export the lock
        run: python scripts/export_lock.py
      - name: Commit the export when it changed
        run: |
          if git diff --quiet -- requirements-lock.txt requirements-test.txt; then
            echo "requirements-lock.txt already matches uv.lock."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements-lock.txt requirements-test.txt
          git commit -m "Regenerate requirements-lock.txt from uv.lock"
          git push
