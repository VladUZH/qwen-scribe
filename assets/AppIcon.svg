<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Qwen Scribe app icon</title>
  <desc id="description">A gradient Q surrounding an audio waveform on a dark rounded square.</desc>
  <defs>
    <linearGradient id="surface" x1="128" y1="96" x2="896" y2="928" gradientUnits="userSpaceOnUse">
      <stop stop-color="#25213A"/>
      <stop offset="0.55" stop-color="#151321"/>
      <stop offset="1" stop-color="#0C0B12"/>
    </linearGradient>
    <linearGradient id="accent" x1="238" y1="210" x2="806" y2="822" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D63D79"/>
      <stop offset="0.48" stop-color="#E65A69"/>
      <stop offset="1" stop-color="#FFAE42"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(365 292) rotate(46) scale(610)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C9366F" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#46237A" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#0F0E16" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="20" y="28" width="984" height="1008" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="30" stdDeviation="34" flood-color="#05040A" flood-opacity="0.58"/>
    </filter>
    <filter id="accentGlow" x="140" y="130" width="760" height="780" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#D94B72" flood-opacity="0.27"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="72" y="64" width="880" height="880" rx="206" fill="url(#surface)"/>
    <rect x="74" y="66" width="876" height="876" rx="204" fill="url(#glow)"/>
    <rect x="73" y="65" width="878" height="878" rx="205" fill="none" stroke="#FFFFFF" stroke-opacity="0.11" stroke-width="4"/>
  </g>

  <g filter="url(#accentGlow)" fill="none" stroke="url(#accent)" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="500" cy="490" r="252" stroke-width="88"/>
    <path d="M665 680L787 807" stroke-width="88"/>
  </g>

  <g fill="url(#accent)">
    <rect x="354" y="449" width="38" height="82" rx="19" opacity="0.80"/>
    <rect x="418" y="402" width="38" height="176" rx="19" opacity="0.92"/>
    <rect x="482" y="354" width="38" height="272" rx="19"/>
    <rect x="546" y="398" width="38" height="184" rx="19" opacity="0.94"/>
    <rect x="610" y="440" width="38" height="100" rx="19" opacity="0.82"/>
  </g>
  <circle cx="500" cy="490" r="302" fill="none" stroke="#FFFFFF" stroke-opacity="0.055" stroke-width="2"/>
</svg>
